<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FEMME board</title>
<style>
  :root { --bg: #f6f5f2; --card: #fff; --ink: #1d1c1a; --muted: #6b6862; --line: #e3e0da; --accent: #2f5d50; --on-accent: #fff;
          --work: #2f5d50; --pause: #9a6b12; --pr: #3d4fa8; --bad: #a33a2a; --done: #8a877f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --card: #201f1d; --ink: #eceae6; --muted: #9d9a94; --line: #34322f; --accent: #7fb8a4; --on-accent: #10201b;
            --work: #7fb8a4; --pause: #e0b25a; --pr: #9aa8f0; --bad: #e08a7a; --done: #8a877f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .02em; flex: 1; }
  .pill { font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; background: var(--card); }
  .bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  form, .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  form { padding: 14px; display: grid; gap: 10px; margin-bottom: 20px; }
  input, textarea, button { font: inherit; border-radius: 9px; }
  input, textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 10px 12px; }
  textarea { min-height: 90px; resize: vertical; }
  button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 7px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; padding: 10px 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 22px 0 8px; display: flex; gap: 8px; align-items: center; }
  h2 b { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .card { padding: 12px 14px; margin-bottom: 8px; }
  .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .title { font-weight: 600; margin: 2px 0; overflow-wrap: anywhere; }
  .body { white-space: pre-wrap; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; margin-top: 4px; }
  .note { font-size: 13px; margin-top: 6px; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  a { color: var(--pr); }
  .empty { color: var(--muted); font-size: 14px; padding: 4px 2px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .err { color: var(--bad); font-size: 14px; }
  #chat { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
  #chat.open { display: flex; }
  #chat .top { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  #chat .top b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #screen { flex: 1; margin: 0; padding: 12px 16px; overflow: auto; font: 12px/1.35 ui-monospace, "SF Mono", Menlo, monospace;
            white-space: pre-wrap; overflow-wrap: anywhere; background: var(--card); }
  #chat form { margin: 0; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 10px 16px 16px; }
  #chat textarea { min-height: 52px; }
  .keys { display: flex; gap: 6px; flex-wrap: wrap; }
  .keys button { min-width: 44px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tabs button { flex: 1; padding: 10px; font-weight: 600; }
  .tabs button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .term { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .term .grow { flex: 1; min-width: 0; }
  .term .cwd { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: none; }
  .dot.working { background: var(--work); } .dot.blocked, .dot.done { background: var(--pause); } .dot.idle { background: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row select { font: inherit; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 9px 10px; }
  .hidden { display: none !important; }
  .st { font-size: 12px; border-radius: 999px; padding: 2px 8px; border: 1px solid var(--line); color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>FEMME</h1>
    <div class="pill" id="usage">usage: waiting for worker</div>
    <button id="out">Sign out</button>
  </header>

  <div class="tabs"><button id="tab-terms">Terminals</button><button id="tab-issues">Issues</button></div>

  <section id="v-terms" class="hidden">
    <form id="newterm">
      <input id="folder" list="folders" placeholder="Folder (empty = home)" autocapitalize="off" autocorrect="off" spellcheck="false">
      <datalist id="folders"></datalist>
      <div class="row">
        <select id="agent"><option value="claude">Claude</option><option value="codex">Codex</option><option value="pi">Pi</option><option value="">Shell</option></select>
        <input id="tlabel" placeholder="Name (optional)" style="flex:1;min-width:120px">
      </div>
      <button class="primary">Open terminal</button>
      <div class="err" id="terr" role="alert"></div>
    </form>
    <div id="terms"></div>
  </section>

  <section id="v-issues" class="hidden">
  <form id="new">
    <input id="repo" list="repos" placeholder="owner/repo" required autocapitalize="off" autocorrect="off" spellcheck="false">
    <datalist id="repos"></datalist>
    <input id="title" placeholder="What should be done?" required>
    <textarea id="body" placeholder="Details, acceptance criteria, files to look at (optional)"></textarea>
    <button class="primary">Add to queue</button>
    <div class="err" id="err" role="alert"></div>
  </form>

  <div id="board"></div>
  </section>
</div>

<div id="chat" role="dialog" aria-label="Chat with the agent">
  <div class="top"><b id="chat-title"></b><span class="st" id="chat-st"></span><button id="chat-kill">End</button><button id="chat-close">Back</button></div>
  <pre id="screen"></pre>
  <form id="say">
    <div class="keys">
      <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
      <button type="button" data-key="enter">Enter</button><button type="button" data-key="esc">Esc</button>
      <button type="button" data-key="up">↑</button><button type="button" data-key="down">↓</button>
    </div>
    <textarea id="msg" placeholder="Message the agent"></textarea>
    <button class="primary">Send</button>
    <div class="err" id="chat-err" role="alert"></div>
  </form>
</div>
<script>
  const SECTIONS = [
    ['waiting', 'Needs you', '--pause'], ['working', 'Working', '--work'], ['paused', 'Paused', '--muted'], ['open', 'Queue', '--muted'],
    ['pr', 'PR ready', '--pr'], ['failed', 'Failed', '--bad'], ['done', 'Done', '--done'],
  ];
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const api = async (url, opts = {}) => {
    const r = await fetch(url, { ...opts, headers: { 'Content-Type': 'application/json' } });
    if (r.status === 401) location.replace('/login');
    return r;
  };
  const ago = t => { const m = Math.round((Date.now() / 1000 - t) / 60); return m < 60 ? `${m}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`; };
  const clock = iso => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  function card(i) {
    const acts = [];
    if (i.pane && ['working', 'waiting', 'paused', 'pr', 'failed'].includes(i.status)) acts.push(`<button data-id="${i.id}" data-pane="${esc(i.pane)}" data-chat="${esc(i.title)}">Chat</button>`);
    if (['paused', 'failed', 'done'].includes(i.status)) acts.push(`<button data-id="${i.id}" data-set="open">Retry</button>`);
    if (i.status === 'pr') acts.push(`<button data-id="${i.id}" data-set="done">Merged, done</button>`);
    if (!['working', 'waiting'].includes(i.status)) acts.push(`<button data-id="${i.id}" data-del>Delete</button>`);
    return `<div class="card">
      <div class="meta"><span>#${i.id}</span><span>${esc(i.repo)}</span><span>${ago(i.updated || i.created)}</span></div>
      <div class="title">${esc(i.title)}</div>
      ${i.body ? `<details><summary>details</summary><div class="body">${esc(i.body)}</div></details>` : ''}
      ${i.note ? `<div class="note">${esc(i.note)}</div>` : ''}
      ${i.pr_url ? `<div class="note"><a href="${esc(i.pr_url)}" target="_blank" rel="noopener">${esc(i.pr_url)}</a></div>` : ''}
      ${acts.length ? `<div class="actions">${acts.join('')}</div>` : ''}
    </div>`;
  }

  async function refresh() {
    const [issues, meta] = await Promise.all([api('/api/issues').then(r => r.json()), api('/api/meta').then(r => r.json())]);
    $('board').innerHTML = SECTIONS.map(([key, label, color]) => {
      const rows = issues.filter(i => i.status === key).sort((a, b) => key === 'open' ? a.id - b.id : (b.updated || 0) - (a.updated || 0));
      if (key === 'done' && rows.length) return `<details><summary><h2 style="display:inline-flex"><b style="background:var(${color})"></b>${label} (${rows.length})</h2></summary>${rows.map(card).join('')}</details>`;
      return `<h2><b style="background:var(${color})"></b>${label}${rows.length ? ` (${rows.length})` : ''}</h2>${rows.length ? rows.map(card).join('') : '<div class="empty">nothing here</div>'}`;
    }).join('');
    if (meta.usage) {
      const u = meta.usage, cap = meta.cap ?? 60;
      $('usage').innerHTML = `Claude ${u.percent}% · agents pause at ${cap}% · resets ${u.resets_at ? clock(u.resets_at) : '?'}${meta.state ? ' · ' + esc(meta.state) : ''}
        <div class="bar"><i style="width:${Math.min(100, u.percent)}%"></i></div>`;
    }
    $('repos').innerHTML = (meta.repos || []).map(r => `<option value="${esc(r)}">`).join('');
  }

  $('new').onsubmit = async e => {
    e.preventDefault();
    $('err').textContent = '';
    const r = await api('/api/issues', { method: 'POST', body: JSON.stringify({ repo: $('repo').value.trim(), title: $('title').value, body: $('body').value }) });
    if (!r.ok) return $('err').textContent = (await r.json()).error;
    $('title').value = $('body').value = '';
    refresh();
  };

  $('board').onclick = async e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.chat !== undefined) return openChat(b.dataset.pane, `#${b.dataset.id} ${b.dataset.chat}`);
    if (b.dataset.del !== undefined) {
      if (!confirm('Delete this issue?')) return;
      await api(`/api/issues/${b.dataset.id}`, { method: 'DELETE' });
    } else {
      await api(`/api/issues/${b.dataset.id}`, { method: 'PATCH', body: JSON.stringify({ status: b.dataset.set, note: '' }) });
    }
    refresh();
  };

  $('out').onclick = async () => { await api('/api/logout', { method: 'POST', body: '{}' }); location.replace('/login'); };

  // Chat: a live view of a terminal on the box plus a message box, refreshed every 3s while open.
  // Agents get your text as a prompt; plain shells get it as a command line.
  let chatPane = null, chatWs = null, chatTimer = null;
  async function pullScreen() {
    const r = await api(`/api/terminals/${chatPane}/screen`);
    const d = await r.json();
    if (!r.ok) { $('chat-st').textContent = 'gone'; $('screen').textContent = d.error; return; }
    const sc = $('screen'), atBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 40;
    $('chat-st').textContent = d.status || 'shell';
    sc.textContent = d.screen.replace(/\s+$/, '');
    if (atBottom) sc.scrollTop = sc.scrollHeight;
  }
  function openChat(pane, title) {
    chatPane = pane;
    chatWs = pane.split(':')[0];
    $('chat-title').textContent = title;
    $('screen').textContent = 'loading…';
    $('chat-err').textContent = '';
    $('chat').classList.add('open');
    pullScreen().then(() => $('screen').scrollTop = $('screen').scrollHeight);
    chatTimer = setInterval(pullScreen, 3000);
  }
  function closeChat() { $('chat').classList.remove('open'); clearInterval(chatTimer); chatPane = null; refresh(); refreshTerms(); }
  $('chat-close').onclick = closeChat;
  $('chat-kill').onclick = async () => {
    if (!confirm('End this terminal? Whatever runs in it stops.')) return;
    await api(`/api/terminals/${chatWs}`, { method: 'DELETE' });
    closeChat();
  };
  $('say').onsubmit = async e => {
    e.preventDefault();
    const text = $('msg').value.trim();
    if (!text) return;
    $('chat-err').textContent = '';
    const r = await api(`/api/terminals/${chatPane}/say`, { method: 'POST', body: JSON.stringify({ text }) });
    if (!r.ok) return $('chat-err').textContent = (await r.json()).error;
    $('msg').value = '';
    setTimeout(pullScreen, 800);
  };
  $('say').onclick = async e => {
    const k = e.target.closest('button[data-key]');
    if (!k) return;
    const r = await api(`/api/terminals/${chatPane}/keys`, { method: 'POST', body: JSON.stringify({ key: k.dataset.key }) });
    if (!r.ok) $('chat-err').textContent = (await r.json()).error;
    setTimeout(pullScreen, 500);
  };

  // Terminals tab: every herdr workspace on the box.
  async function refreshTerms() {
    const r = await api('/api/terminals');
    if (!r.ok) return $('terms').innerHTML = `<div class="err">${esc((await r.json()).error)}</div>`;
    const d = await r.json();
    $('folders').innerHTML = d.folders.map(f => `<option value="${esc(f)}">`).join('');
    $('terms').innerHTML = d.workspaces.length ? d.workspaces.map(w => w.panes.map(p => `
      <div class="card term" data-pane="${esc(p.pane_id)}" data-title="${esc(w.label + (p.title ? ' · ' + p.title : ''))}">
        <span class="dot ${esc(p.status || '')}"></span>
        <div class="grow"><div class="title">${esc(w.label)}${w.panes.length > 1 ? ` <span class="st">${esc(p.pane_id)}</span>` : ''}</div>
          <div class="cwd">${esc(p.agent || 'shell')}${p.status && p.status !== 'unknown' ? ' · ' + esc(p.status) : ''}${p.title ? ' · ' + esc(p.title) : ''}</div>
          <div class="cwd">${esc(p.cwd || '')}</div></div>
      </div>`).join('')).join('') : '<div class="empty">no terminals</div>';
  }
  $('terms').onclick = e => { const c = e.target.closest('.term'); if (c) openChat(c.dataset.pane, c.dataset.title); };
  $('newterm').onsubmit = async e => {
    e.preventDefault();
    $('terr').textContent = '';
    const r = await api('/api/terminals', { method: 'POST', body: JSON.stringify({ cwd: $('folder').value, agent: $('agent').value, label: $('tlabel').value }) });
    const d = await r.json();
    if (!r.ok) return $('terr').textContent = d.error;
    $('tlabel').value = '';
    await refreshTerms();
    openChat(d.pane_id, $('folder').value.split('/').pop() || 'home');
  };

  function show(tab) {
    $('v-terms').classList.toggle('hidden', tab !== 'terms');
    $('v-issues').classList.toggle('hidden', tab !== 'issues');
    $('tab-terms').classList.toggle('on', tab === 'terms');
    $('tab-issues').classList.toggle('on', tab === 'issues');
    try { localStorage.setItem('femme-tab', tab); } catch {}
  }
  $('tab-terms').onclick = () => { show('terms'); refreshTerms(); };
  $('tab-issues').onclick = () => { show('issues'); refresh(); };
  let saved = 'terms';
  try { saved = localStorage.getItem('femme-tab') || 'terms'; } catch {}
  show(saved);
  refreshTerms();
  setInterval(() => { if (!chatPane && !$('v-terms').classList.contains('hidden')) refreshTerms(); }, 10000);

  refresh();
  setInterval(refresh, 10000);
</script>
</body>
</html>
