<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FEMME sign in</title>
<style>
  :root { --bg: #f6f5f2; --card: #fff; --ink: #1d1c1a; --muted: #6b6862; --line: #e3e0da; --accent: #2f5d50; --on-accent: #fff; --bad: #a33a2a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --card: #201f1d; --ink: #eceae6; --muted: #9d9a94; --line: #34322f; --accent: #7fb8a4; --on-accent: #10201b; --bad: #e08a7a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
  main { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: .02em; }
  p { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  input, button { width: 100%; font: inherit; border-radius: 10px; padding: 12px 14px; }
  input { border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin-bottom: 12px; }
  button { border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; }
  .msg { margin-top: 14px; font-size: 14px; color: var(--muted); }
  .msg.bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>FEMME</h1>
  <p id="lead">Enter your email for a sign-in link.</p>
  <form id="f">
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
    <button id="go">Email me a link</button>
  </form>
  <div class="msg" id="msg" role="status"></div>
</main>
<script>
  const $ = id => document.getElementById(id);
  const post = (url, body) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const token = (location.pathname.match(/^\/magic\/([0-9a-f]+)$/) || [])[1];

  if (token) {
    // The emailed link lands here; signing in takes a click, so mail scanners
    // that open links can't use it up.
    $('lead').textContent = 'Tap to finish signing in on this device.';
    $('email').remove();
    $('go').textContent = 'Sign in';
  }

  $('f').onsubmit = async e => {
    e.preventDefault();
    $('go').disabled = true;
    $('msg').className = 'msg';
    if (token) {
      const r = await post('/api/magic', { token });
      if (r.ok) return location.replace('/');
      $('msg').className = 'msg bad';
      $('msg').textContent = (await r.json()).error;
      $('go').disabled = false;
    } else {
      await post('/api/login', { email: $('email').value });
      $('msg').textContent = 'If that address is allowed, a link is on its way. It works once, for 15 minutes.';
    }
  };
</script>
</body>
</html>
