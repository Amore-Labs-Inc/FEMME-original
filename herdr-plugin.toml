id = "femme"
name = "femme"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Fork the focused agent, conversation and working tree, onto your always-on VPS. Claude Code, Codex, Pi."
platforms = ["linux", "macos"]

[[actions]]
id = "fork-remote"
title = "Fork agent to VPS"
description = "Copy the focused agent's repo and conversation to the VPS and continue it in a new workspace there"
contexts = ["pane"]
command = ["sh", "fork-remote.sh"]

[[actions]]
id = "files"
title = "Files · drop box"
description = "Open a drop box beside the focused agent: a file dragged from the laptop onto it lands in the agent's folder here"
contexts = ["pane"]
command = ["sh", "files.sh"]

# The pane files.sh opens. bash, not sh: the loop needs read -t, which dash lacks.
[[panes]]
id = "files"
title = "Files · drop box"
placement = "split"
command = ["bash", "files-pane.sh"]
